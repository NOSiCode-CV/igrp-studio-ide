# GlitchTip — backend compatível com DSN do Sentry SDK (local / testes).
# Ver README na mesma pasta.
#
# Arranque: docker compose -f docker/monitoring/docker-compose.yml up -d
# UI: http://localhost:8000 — criar conta → organização → projeto → copiar DSN

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_HOST_AUTH_METHOD: trust
        volumes:
            - glitchtip-pg:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 5

    glitchtip:
        image: glitchtip/glitchtip:6
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - '8000:8000'
        environment:
            DATABASE_URL: postgres://postgres@postgres:5432/postgres
            VALKEY_URL: ''
            SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-only-replace-with-openssl-rand-hex-32}
            EMAIL_URL: consolemail://
            GLITCHTIP_DOMAIN: http://localhost:8000
            DEFAULT_FROM_EMAIL: glitchtip@localhost
            ENABLE_USER_REGISTRATION: 'true'
            GLITCHTIP_ENABLE_LOGS: 'false'
            GLITCHTIP_ENABLE_UPTIME: 'false'
            SERVER_ROLE: all_in_one
        volumes:
            - glitchtip-uploads:/code/uploads
        restart: unless-stopped

volumes:
    glitchtip-pg:
    glitchtip-uploads:
