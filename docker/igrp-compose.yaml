name: 'demoteste-igrp'

networks:
  demoteste-network:
    driver: bridge

services:

  demoteste-nginx:
    image: nginx:1.25-alpine
    container_name: demoteste-nginx
    restart: unless-stopped
    ports:
      - "${HOST_NGINX_HTTP_PORT:-2575}:2575"
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "proxy"
      name: "nginx"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2575/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  demoteste-database-postgres:
    image: postgres:16-alpine
    container_name: demoteste-database-postgres
    restart: unless-stopped
    hostname: ${IGRP_LOCAL_DATABASE_HOSTNAME}
    environment:
      - POSTGRES_DB=${IGRP_DATABASE_NAME}
      - POSTGRES_USER=${IGRP_DATABASE_USER}
      - POSTGRES_PASSWORD=${IGRP_DATABASE_PASSWORD}
    env_file:
      - .env
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "database"
      name: "postgres"
    volumes:
      - igrp-postgres_data:/var/lib/postgresql/data2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IGRP_DATABASE_USER} -d ${IGRP_DATABASE_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    shm_size: 256mb

  # Bootstrap task: prepares the Keycloak database before the service starts.
  demoteste-iam-db-prepare:
    image: postgres:16-alpine
    container_name: demoteste-iam-db-prepare
    restart: "no"
    depends_on:
      demoteste-database-postgres:
        condition: service_healthy
    environment:
      - IGRP_LOCAL_DATABASE_HOSTNAME=${IGRP_LOCAL_DATABASE_HOSTNAME}
      - IGRP_DATABASE_USER=${IGRP_DATABASE_USER}
      - IGRP_DATABASE_PASSWORD=${IGRP_DATABASE_PASSWORD}
      - TARGET_DATABASE=${IGRP_IAM_DATABASE_NAME}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "init-task"
      name: "keycloakDatabasePrepare"
    volumes:
      - ./.igrpstudio/db-init/keycloak/init-database.sh:/scripts/init-database.sh:ro
    command: ["sh", "/scripts/init-database.sh"]

  # Bootstrap task: prepares the Access Management database before the service starts.
  demoteste-access-management-db-prepare:
    image: postgres:16-alpine
    container_name: demoteste-access-management-db-prepare
    restart: "no"
    depends_on:
      demoteste-database-postgres:
        condition: service_healthy
    environment:
      - IGRP_LOCAL_DATABASE_HOSTNAME=${IGRP_LOCAL_DATABASE_HOSTNAME}
      - IGRP_DATABASE_USER=${IGRP_DATABASE_USER}
      - IGRP_DATABASE_PASSWORD=${IGRP_DATABASE_PASSWORD}
      - TARGET_DATABASE=${IGRP_DATABASE_NAME}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "init-task"
      name: "accessManagementDatabasePrepare"
    volumes:
      - ./.igrpstudio/db-init/access-management/init-database.sh:/scripts/init-database.sh:ro
    command: ["sh", "/scripts/init-database.sh"]

  demoteste-gateway:
    image: registry.nosi.cv/igrp/igrp-gateway:latest
    container_name: demoteste-gateway
    restart: unless-stopped
    depends_on:
        demoteste-eureka:
          condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVICE_URL}
      - EUREKA_CLIENT_REGISTERWITHEUREKA=true
      - EUREKA_CLIENT_FETCHREGISTRY=true
      - SPRING_CLOUD_DISCOVERY_ENABLED=true
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=true
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID=true
      - JAVA_OPTS=${JAVA_OPTS}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "web"
      name: "igrpApiGateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  demoteste-eureka:
    image: registry.nosi.cv/igrp/igrp-eureka:latest
    container_name: demoteste-eureka
    restart: unless-stopped
    environment:
      - SERVER_PORT=8761
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "service-discovery"
      name: "eureka"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  demoteste-iam-keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    container_name: demoteste-iam-keycloak
    restart: unless-stopped
    depends_on:
        demoteste-database-postgres:
          condition: service_healthy
        demoteste-iam-db-prepare:
          condition: service_completed_successfully
    hostname: demoteste-iam-keycloak
    environment:
      - KC_HTTP_ENABLED=true
      - KC_ENABLE_STATISTICS=true
      - KC_ENABLE_HEALTH_ENDPOINTS=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_PROXY_ADDRESS_FORWARDING=true
      - KC_HTTP_RELATIVE_PATH=auth
      - KC_HOSTNAME=${DOCKER_IP}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HOSTNAME_PORT=${NGINX_HTTP_PORT}
      - KC_FRONTEND_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/auth
      - KC_BOOTSTRAP_ADMIN_USERNAME=${IGRP_IAM_ADMIN_USER}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${IGRP_IAM_ADMIN_PASSWORD}
      - KC_DB_VENDOR=postgresql
      - KC_DB_HOST=${IGRP_LOCAL_DATABASE_HOSTNAME}
      - KC_DB_PORT=5432
      - KC_DB_NAME=${IGRP_IAM_DATABASE_NAME}
      - KC_DB_USER=${IGRP_DATABASE_USER}
      - KC_DB_PASSWORD=${IGRP_DATABASE_PASSWORD}
      - JAVA_OPTS=${JAVA_OPTS}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "auth"
      name: "keycloak"
    volumes:
      - ./.igrpstudio/auth/data/igrp-realm.json:/opt/keycloak/data/import/igrp-realm.json:ro
    command: ["start"]
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /auth/realms/igrp/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          head -n 1 <&3 | grep '200'
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  demoteste-minio:
    image: minio/minio:latest
    container_name: demoteste-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${IGRP_OBJECT_STORAGE_USER}
      - MINIO_ROOT_PASSWORD=${IGRP_OBJECT_STORAGE_PASSWORD}
      - MINIO_BUCKET_NAME=IGRP_OBJECT_STORAGE_BUCKET_NAME
      - MINIO_BROWSER_REDIRECT_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/minio/
    env_file:
      - .env
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "storage"
      name: "minio"
    volumes:
      - igrp-minio_data:/data
      - ./.igrpstudio/igrp-minio-init.sh:/docker-entrypoint.sh
    command: ["server", "/data", "--console-address", ":9001"]
    entrypoint: ["/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  demoteste-access-management:
    image: registry.nosi.cv/igrp/access-management-api-jvm:latest
    container_name: demoteste-access-management
    restart: unless-stopped
    depends_on:
        demoteste-iam-keycloak:
          condition: service_healthy
        demoteste-database-postgres:
          condition: service_healthy
        demoteste-access-management-db-prepare:
          condition: service_completed_successfully
        demoteste-eureka:
          condition: service_healthy
        demoteste-redis:
          condition: service_healthy
        demoteste-minio:
          condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=demoteste-access-management
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${ACCESS_MANAGEMENT_JPA_HIBERNATE_DDL_AUTO}
      - ENABLE_SWAGGER=${ACCESS_MANAGEMENT_ENABLE_SWAGGER}
      - JAVA_OPTS=${JAVA_OPTS}
      - POSTGRES_HOST=${IGRP_LOCAL_DATABASE_HOSTNAME}
      - POSTGRES_DATABASE=${IGRP_DATABASE_NAME}
      - POSTGRES_USER=${IGRP_DATABASE_USER}
      - POSTGRES_PASSWORD=${IGRP_DATABASE_PASSWORD}
      - IGRP_KEYCLOAK_SERVER_URL=http://${IGRP_IAM_HOSTNAME}:8080/auth
      - IGRP_KEYCLOAK_REALM=${IGRP_IAM_TENANT}
      - IGRP_KEYCLOAK_CLIENT_ID=${IGRP_IAM_CLIENT_ID:-access-management}
      - IGRP_KEYCLOAK_CLIENT_SECRET=${IGRP_IAM_CLIENT_SECRET:-**********}
      - IGRP_KEYCLOAK_GRANT_TYPE=client_credentials
      - AUTH_JWT_ISSUER=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/auth/realms/igrp
      - IGRP_STORAGE_PROVIDER=minio
      - IGRP_STORAGE_ENDPOINT=${IGRP_OBJECT_STORAGE_HOST}
      - IGRP_STORAGE_PORT=${IGRP_OBJECT_STORAGE_PORT}
      - IGRP_STORAGE_SECURITY=${IGRP_OBJECT_STORAGE_SECURITY}
      - IGRP_STORAGE_ACCESS_KEY=${IGRP_OBJECT_STORAGE_USER}
      - IGRP_STORAGE_SECRET_KEY=${IGRP_OBJECT_STORAGE_PASSWORD}
      - IGRP_STORAGE_BUCKET_NAME=${IGRP_OBJECT_STORAGE_BUCKET_NAME}
      - IGRP_STORAGE_REGION=${IGRP_OBJECT_STORAGE_REGION}
      - IGRP_STORAGE_PRESIGNED_URL_EXPIRATION_TIME=300
      - EUREKA_CLIENT_ENABLED=true
      - SPRING_CLOUD_DISCOVERY_ENABLED=true
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_SERVICE_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVICE_URL}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - SPRING_DATA_REDIS_HOST=demoteste-redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRINGDOC_SWAGGER_UI_DISABLE_SWAGGER_DEFAULT_URL=true
      - SPRINGDOC_SWAGGER_UI_CONFIG_URL=/gateway-api/demoteste-access-management/v3/api-docs/swagger-config
      - SPRINGDOC_SWAGGER_UI_URL=/gateway-api/demoteste-access-management/v3/api-docs
      - OPENAPI_SERVER_API=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-access-management
      - OTEL_DISABLED=${ACCESS_MANAGEMENT_OTEL_DISABLED}
      - OTEL_COLLECTOR_ENDPOINT=${ACCESS_MANAGEMENT_OTEL_COLLECTOR_ENDPOINT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${ACCESS_MANAGEMENT_OTEL_COLLECTOR_ENDPOINT}
      - IGRP_NOTIFICATIONS_ENABLED=${ACCESS_MANAGEMENT_NOTIFICATIONS_ENABLED}
      - IGRP_SUPERADMIN_USER_EXTERNAL_ID=${ACCESS_MANAGEMENT_SUPERADMIN_USER_EXTERNAL_ID}
      - IGRP_ACCESS_M2M_SYNC_TOKEN=${ACCESS_MANAGEMENT_M2M_SYNC_TOKEN}
      - IGRP_APP_CENTER_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "web"
      name: "igrpAccessManagement"
    command: ["/app/access-management", "--spring.profiles.active=development"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  demoteste-application-center:
    image: registry.nosi.cv/igrp/igrp-application-center:latest
    container_name: demoteste-application-center
    depends_on:
        demoteste-access-management:
          condition: service_healthy
    environment:
      - AUTH_PROVIDER=${AUTH_PROVIDER}
      - KEYCLOAK_ISSUER=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/auth/realms/igrp
      - KEYCLOAK_CLIENT_ID=${IGRP_IAM_CLIENT_ID:-access-management}
      - KEYCLOAK_CLIENT_SECRET=${IGRP_IAM_CLIENT_SECRET:-**********}
      - NEXTAUTH_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - IGRP_ACCESS_MANAGEMENT_API=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-access-management
      - IGRP_APP_CODE=APP_IGRP_CENTER
      - IGRP_PREVIEW_MODE=false
      - IGRP_APP_NAME_DESCRIPTION=IGRP
      - IGRP_SYNC_ON_CODE_MENUS=${APP_CENTER_SYNC_ON_CODE_MENUS}
      - IGRP_SYNC_ACCESS=${APP_CENTER_SYNC_ACCESS}
      - IGRP_M2M_SERVICE_ID=${APP_CENTER_M2M_SERVICE_ID}
      - IGRP_M2M_TOKEN=${APP_CENTER_M2M_TOKEN}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "web"
      name: "igrpApplicationCenter"

  demoteste-redis:
    image: redis:latest
    container_name: demoteste-redis
    restart: unless-stopped
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "cache"
      name: "redis"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  demoteste-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: demoteste-pgadmin
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@igrp.cv}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-igrp123456}
      - SCRIPT_NAME=/pgadmin
      - PGADMIN_LISTEN_PORT=${PGADMIN_LISTEN_PORT:-80}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "database"
      name: "pgadmin"
    volumes:
      - igrp-pgadmin_data:/var/lib/pgadmin


volumes:
  igrp-postgres_data:
    driver: local
  igrp-minio_data:
    driver: local
  igrp-pgadmin_data:
    driver: local
