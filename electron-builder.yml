appId: cv.nosi.igrpstudio.beta
productName: igrp-studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,yarn.lock}'
  - '!certificate.pfx'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Desativar asar para as dependências e binários .node ficarem no disco
# (inclui native bindings de node-pty, parcel/watcher, cpu-features e
# @lancedb/lancedb — Specification project type / Knowledge Base).
asar: false
win:
  executableName: igrp-studio
  signtoolOptions:
    certificateFile: certificate.pfx
    certificatePassword: ${env.CERTIFICATE_PASSWORD}
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
    publisherName: NOSI – Núcleo Operacional Sistema Informação, E.P.E.
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  identity: 'NOSi (QT6DP36974)'
  type: distribution
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - universal
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  title: ${productName} ${version}
  icon: resources/icons/icon.icns
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: https://igrp.cv
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
