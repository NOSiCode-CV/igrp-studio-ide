stages:
  - build
  - release
cache:
  paths:
    - node_modules/
build_packagedev:
  image: node
  stage: build
  only:
    - master
  before_script:
    - apt-get update
    - apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
    - dpkg --add-architecture i386
    - apt-get update
    - apt-get install -y wine64 wine32
  script:
    - yarn install
    - yarn build:win
    - yarn build:linux
    - yarn build:mac
    - yarn build:mac:x64
  artifacts:
    paths:
      - dist/
    expire_in: 4 week

release:
  stage: release
  image: curlimages/curl:latest
  script:
    - echo "Creating a new release on GitLab..."
    - |
      curl --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data '{
          "name": "Release $CI_COMMIT_TAG",
          "tag_name": "$CI_COMMIT_TAG",
          "description": "Release for commit $CI_COMMIT_SHA",
          "assets": {
            "links": [
              {
                "name": "Download",
                "url": "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download"
              }
            ]
          }
        }' \
        "https://git.nosi.cv/api/v4/projects/$CI_PROJECT_ID/releases"
        # $CI_API_V4_URL equals http://git.nosi.cv/api/v4. As per the curl standard, this results in a redirection from POST (http) to GET (https). Therefore, cannot be used here.
  # only:
    # - tags
  dependencies:
    - build_packagedev
  needs:
    - build_packagedev
