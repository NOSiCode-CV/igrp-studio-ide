stages:
  - build
  - release

cache:
  paths:
    - node_modules/

build_packagedev_mac:
  rules:
    - when: never  # Mac build disabled; to re-enable: use - if: $CI_COMMIT_TAG
  image: node
  stage: build
  tags:
    - arm64
  variables:
    ELECTRON_BUILDER_CACHE: '${CI_PROJECT_DIR}/.cache/electron-builder'
  before_script:
    - apt-get update
    - apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
    - dpkg --add-architecture arm64
    - apt-get update
    - apt-get install -y wine64
    - echo "$CERTIFICATE_BASE64" | base64 -d > certificate.pfx
    - test -s certificate.pfx
    - |
      printf '%s\n' \
        'registry=https://sonatype.nosi.cv/repository/npm-group/' \
        '@igrp:registry=https://sonatype.nosi.cv/repository/igrp/' \
        "//sonatype.nosi.cv/repository/npm-group/:username=${SONATYPE_USERNAME}" \
        "//sonatype.nosi.cv/repository/npm-group/:_password=${SONATYPE_PASSWORD}" \
        "//sonatype.nosi.cv/repository/igrp/:username=${SONATYPE_USERNAME}" \
        "//sonatype.nosi.cv/repository/igrp/:_password=${SONATYPE_PASSWORD}" \
        > .npmrc

  script:
    - yarn install --frozen-lockfile --ignore-engines --ignore-scripts
    - yarn release:mac
  artifacts:
    paths:
      # Keep the unpacked app available for the in-job verifier, but publish
      # only distributable files. Uploading dist/ also archives tens of
      # thousands of unpacked dependency files and exceeds the GitLab limit.
      - dist/*.dmg
      - dist/*.zip
      - dist/*.pkg
      - dist/*.blockmap
      - dist/*.yml
    expire_in: 4 weeks
  cache:
    paths:
      - .cache/electron-builder
      - node_modules/

build_packagedev_windows:
  image: node
  stage: build
  only:
    - tags
  variables:
    ELECTRON_BUILDER_CACHE: '${CI_PROJECT_DIR}/.cache/electron-builder'
    NODE_OPTIONS: '--max-old-space-size=4096'
  before_script:
    - apt-get update
    - apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
    # The current node image does not expose Yarn on PATH. Install the
    # repository's Yarn 1 tool explicitly before any yarn command is used.
    - npm install --global yarn@1.22.22
    - yarn --version
    - dpkg --add-architecture i386
    - apt-get update
    - apt-get install -y wine64 wine32
    - wget http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.0g-2ubuntu4_amd64.deb
    - dpkg -i libssl1.1_1.1.0g-2ubuntu4_amd64.deb

    - |
      if [[ "${CI_COMMIT_TAG}" == *-candidate.* ]]; then
        echo "Acceptance candidate: Windows code signing is optional."
      else
        echo "$CERTIFICATE_BASE64" | base64 -d > certificate.pfx
        test -s certificate.pfx
      fi
    - |
      printf '%s\n' \
        'registry=https://sonatype.nosi.cv/repository/npm-group/' \
        '@igrp:registry=https://sonatype.nosi.cv/repository/igrp/' \
        "//sonatype.nosi.cv/repository/npm-group/:username=${SONATYPE_USERNAME}" \
        "//sonatype.nosi.cv/repository/npm-group/:_password=${SONATYPE_PASSWORD}" \
        "//sonatype.nosi.cv/repository/igrp/:username=${SONATYPE_USERNAME}" \
        "//sonatype.nosi.cv/repository/igrp/:_password=${SONATYPE_PASSWORD}" \
        > .npmrc

  script:
    - yarn install --frozen-lockfile --ignore-engines --ignore-scripts
    # Build the renderer with the Linux host dependencies first. The target
    # native packages are installed only after the build so Vite can still run
    # on Linux while the packaged app receives Windows x64 bindings.
    - yarn typecheck
    - yarn test --runInBand
    # Fail the candidate before packaging if the public engine contract cannot
    # generate two domain modules, cross-module relations, DTO inheritance,
    # enums and endpoint controllers.
    - node scripts/stress-cross-module.mjs technical Sqlite "$CI_PROJECT_DIR/.e2e/cross-module"
    - yarn electron-vite build
    - node scripts/prepare-target-native-deps.mjs win32 x64
    # Publish only from the gated release job after this verification passes.
    - |
      if [[ "${CI_COMMIT_TAG}" == *-candidate.* ]]; then
        echo "Building unsigned Windows acceptance candidate"
        yarn electron-builder --win --config electron-builder-unsigned.yml --publish never
      else
        yarn electron-builder --win --config electron-builder.yml --publish never
      fi
    - node scripts/verify-win-artifact.mjs
  artifacts:
    paths:
      - dist/*.exe
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.snap
      - dist/*.blockmap
      - dist/*.yml
    expire_in: 4 weeks
  cache:
    paths:
      - .cache/electron-builder
      - node_modules/

build_packagedev_linux:
  image: node
  stage: build
  only:
    - tags
  variables:
    ELECTRON_BUILDER_CACHE: '${CI_PROJECT_DIR}/.cache/electron-builder'
  before_script:
    - apt-get update
    - apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
    # Keep the Linux candidate job independent of the base image's package
    # manager shims; the project lockfile is a Yarn 1 lockfile.
    - npm install --global yarn@1.22.22
    - yarn --version
    - |
      printf '%s\n' \
        'registry=https://sonatype.nosi.cv/repository/npm-group/' \
        '@igrp:registry=https://sonatype.nosi.cv/repository/igrp/' \
        "//sonatype.nosi.cv/repository/npm-group/:username=${SONATYPE_USERNAME}" \
        "//sonatype.nosi.cv/repository/npm-group/:_password=${SONATYPE_PASSWORD}" \
        "//sonatype.nosi.cv/repository/igrp/:username=${SONATYPE_USERNAME}" \
        "//sonatype.nosi.cv/repository/igrp/:_password=${SONATYPE_PASSWORD}" \
        > .npmrc
  script:
    - yarn install --frozen-lockfile --ignore-engines --ignore-scripts
    - node scripts/stress-cross-module.mjs technical Sqlite "$CI_PROJECT_DIR/.e2e/cross-module"
    - yarn release:linux
  artifacts:
    paths:
      # Publish only distributable Linux files; dist/linux-unpacked contains
      # tens of thousands of runtime files and exceeds the GitLab limit.
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.snap
      - dist/*.blockmap
      - dist/*.yml
    expire_in: 4 weeks
  cache:
    paths:
      - .cache/electron-builder
      - node_modules/

release:
  stage: release
  only:
    - tags
  image: curlimages/curl:latest
  script:
    - echo "Uploading artifacts to GitLab release..."
    - |
      for file in dist/*; do
        filename=$(basename "$file" | sed 's/ /%20/g')
        echo "Uploading $file..."
        UPLOAD_URL="https://git.nosi.cv/api/v4/projects/${CI_PROJECT_ID}/packages/generic/electron-builder/${CI_COMMIT_TAG}/$(basename "$file")"
        echo "Upload URL: $UPLOAD_URL"
        
        if [[ -n "${GITLAB_TOKEN}" && -n "${CI_PROJECT_ID}" && -n "${CI_COMMIT_TAG}" ]]; then
          curl --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
               --upload-file "$file" \
               "$UPLOAD_URL"
        else
          echo "Error: Missing required environment variables."
          exit 1
        fi
      done

    - echo "Creating a new release on GitLab..."
    - |
      curl --request POST \
           --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
           --header "Content-Type: application/json" \
           --data "{
             \"name\": \"Release ${CI_COMMIT_TAG}\",
             \"tag_name\": \"${CI_COMMIT_TAG}\",
             \"description\": \"Release for commit ${CI_COMMIT_SHA}\",
             \"assets\": {
               \"links\": [
                 {
                   \"name\": \"Download\",
                   \"url\": \"https://git.nosi.cv/api/v4/projects/${CI_PROJECT_ID}/packages/generic/electron-builder/${CI_COMMIT_TAG}\"
                 }
               ]
             }
           }" \
           "https://git.nosi.cv/api/v4/projects/${CI_PROJECT_ID}/releases"

  needs:
    - build_packagedev_windows
    - build_packagedev_linux
