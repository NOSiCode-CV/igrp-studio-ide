name: Sync Merged PR to GitLab
on:
  pull_request:
    types: [closed]

jobs:
  sync-to-gitlab:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history

      - name: Configure Git Identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Push to GitLab
        run: |
          git remote add gitlab http://oauth2:${{ secrets.GITLAB_TOKEN }}@git.nosi.cv/igrp-3_0/igrp-studio-horizon.git
          git push gitlab HEAD:github-releases  # Replace "main" if your branch is different
