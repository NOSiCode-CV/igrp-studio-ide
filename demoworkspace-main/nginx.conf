user  nginx;
worker_processes  auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use               epoll;
    multi_accept      on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    #── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    #── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 100;

    client_max_body_size      100M;
    client_body_buffer_size   32k;
    client_header_buffer_size 32k;
    large_client_header_buffers 8 32k;

    #── Gzip Compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Preserve the client proto
    map $http_x_forwarded_proto $client_scheme {
        default  $scheme;
        ~*^https$ https;
    }

    #── WebSocket support ─────────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ''        close;
    }

    #── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-XSS-Protection       "1; mode=block"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    #── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    #── Resolver for Docker DNS ───────────────────────────────────────────────
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    #── Common proxy settings ─────────────────────────────────────────────────
    proxy_connect_timeout   30s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    proxy_buffering         on;
    proxy_buffer_size       128k;
    proxy_buffers           16 128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $client_scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    server {
        listen   2575 default_server;
        server_name _;

        # Health check
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy';
        }

        location = /pgadmin {
            return 301 $scheme://$host:$server_port/pgadmin/;
        }

        location ^~ /pgadmin/ {
            set $upstream demoteste-pgadmin:80;

            proxy_set_header X-Script-Name /pgadmin;

            proxy_pass http://$upstream;
            proxy_redirect off;
        }


        location = /grafana {
            return 301 $scheme://$host:$server_port/grafana/;
        }

        location ^~ /grafana/ {


        location = /prometheus {
            return 301 $scheme://$host:$server_port/prometheus/;
        }

        location ^~ /prometheus/ {
            set $upstream demoteste-prometheus:9090;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_pass http://$upstream;
            proxy_redirect off;
        }


            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_pass http://$upstream;
            proxy_redirect off;
        }

        location = /auth {
           return 301 $client_scheme://$host:$server_port/auth/$is_args$args;

        }

        location /auth/ {
            set $upstream demoteste-iam-keycloak:8080;
            proxy_pass         http://$upstream;
        }

        location = /minio {
            return 301 $client_scheme://$host:$server_port/minio/$is_args$args;
        }

        location ^~ /minio {
            set $upstream demoteste-minio:9001;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            rewrite ^/minio/(.*)$ /$1 break;
            proxy_pass http://$upstream;
        }

        #Eureka
        location = /eureka {
            return 301 $scheme://$host:$server_port/eureka/;
        }

        location = /eureka/ {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            set $upstream demoteste-eureka:8761;
            proxy_pass http://$upstream/;
            proxy_intercept_errors off;
        }

        location ^~ /eureka/ {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            set $upstream demoteste-eureka:8761;
            proxy_pass http://$upstream;
            proxy_intercept_errors off;
        }

        # API Gateway
        location ^~ /gateway-api/ {
            set $upstream demoteste-gateway:8080;
            rewrite ^/gateway-api/?(.*)$ /$1 break;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$upstream;
        }

        location ~ ^/apps/(?<svc>[^/]+)(?<rest>/.*|$) {
            set $target "${svc}:3000";
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-Prefix /apps/$svc;
            proxy_pass http://$target$request_uri;
            proxy_redirect off;
        }
        # Dynamic for frontend /apps/<service>/<path> routing
        #location ~ ^/apps/(?<svc>[^/]+)(?<rest>/.*|$) {
        #    limit_req zone=api burst=20 nodelay;
        #    set $target "${svc}:3000";
        #    proxy_set_header Upgrade    $http_upgrade;
        #    proxy_set_header Connection $connection_upgrade;
        #    proxy_pass http://$target$rest;
        #    proxy_set_header Host $http_host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #    proxy_set_header X-Forwarded-Proto $client_scheme;
        #    proxy_set_header X-Forwarded-Port  $server_port;
        #    proxy_redirect off;
        #}

        location / {
            set $upstream demoteste-application-center:3000;
            proxy_pass http://$upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_redirect off;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
