name: 'demoteste-monitoring-infra'

networks:
  default:
    name: demoteste-igrp_default
    external: true

services:
  demoteste-otel-collector:
      image: otel/opentelemetry-collector-contrib:0.82.0
      container_name: demoteste-otel-collector
      restart: always
      extra_hosts:
        - "demoteste-igrp:host-gateway"
        - "demoteste:host-gateway"
      command:
        - --config=/etc/otelcol-cont/otel-collector.yml
      volumes:
        - ./monitoring/collector/otel-collector.yml:/etc/otelcol-cont/otel-collector.yml
      env_file:
      - .env_monitoring
  
  demoteste-prometheus:
    image: prom/prometheus:v2.51.2
    container_name: demoteste-prometheus
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    env_file:
      - .env_monitoring

  demoteste-cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: demoteste-cadvisor
    restart: always
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
  
  demoteste-loki:
    image: grafana/loki:3.0.0
    container_name: demoteste-loki
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    command: "-config.expand-env=true -config.file=/etc/loki/local-config.yaml"
    env_file:
      - .env_monitoring
  
  demoteste-tempo:
    image: grafana/tempo:2.10.3
    container_name: demoteste-tempo
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    command: "-config.expand-env=true -config.file /etc/tempo-config.yml"
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo-config.yml
    env_file:
      - .env_monitoring
  
  demoteste-grafana:
    image: grafana/grafana:10.4.2
    container_name: demoteste-grafana
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    depends_on:
      - demoteste-prometheus
      - demoteste-loki
      - demoteste-tempo
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    env_file:
      - .env_monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=${GRAFANA_ALLOW_SIGN_UP}
      - GF_SERVER_ROOT_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true



volumes:
  grafana_data:
    driver: local
