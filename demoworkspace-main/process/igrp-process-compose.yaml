name: 'demoteste-process-igrp'

networks:
  default:
    name: demoteste-igrp_default
    external: true

services:

  # Bootstrap task: prepares the Process Management database before the API starts.
  demoteste-process-management-db-prepare:
    image: postgres:16-alpine
    container_name: demoteste-process-management-db-prepare
    restart: "no"
    env_file:
      - .env_process
    environment:
      - IGRP_LOCAL_DATABASE_HOSTNAME=${IGRP_LOCAL_DATABASE_HOSTNAME}
      - IGRP_DATABASE_USER=${IGRP_DATABASE_USER}
      - IGRP_DATABASE_PASSWORD=${IGRP_DATABASE_PASSWORD}
      - TARGET_DATABASE=${IGRP_PROCESS_DATABASE_MANAGEMENT}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "init-task"
      name: "processManagementDatabasePrepare"
    volumes:
      - ./db-init/process-management/init-database.sh:/scripts/init-database.sh:ro
    command: ["sh", "/scripts/init-database.sh"]

  # Bootstrap task: prepares the Process Studio database before the API starts.
  demoteste-process-studio-db-prepare:
    image: postgres:16-alpine
    container_name: demoteste-process-studio-db-prepare
    restart: "no"
    env_file:
      - .env_process
    environment:
      - IGRP_LOCAL_DATABASE_HOSTNAME=${IGRP_LOCAL_DATABASE_HOSTNAME}
      - IGRP_DATABASE_USER=${IGRP_DATABASE_USER}
      - IGRP_DATABASE_PASSWORD=${IGRP_DATABASE_PASSWORD}
      - TARGET_DATABASE=${IGRP_PROCESS_DATABASE_STUDIO}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "init-task"
      name: "processStudioDatabasePrepare"
    volumes:
      - ./db-init/process-studio/init-database.sh:/scripts/init-database.sh:ro
    command: ["sh", "/scripts/init-database.sh"]

  demoteste-process-management-api:
    image: registry.nosi.cv/igrp/igrp-process-management-backend-api-jvm:latest
    container_name: demoteste-process-management-api
    restart: unless-stopped
    depends_on:
      demoteste-process-management-db-prepare:
        condition: service_completed_successfully
    env_file:
      - .env_process
    environment:
      - SERVICE_PORT=8080
      - SPRING_DATASOURCE_USERNAME=${IGRP_DATABASE_USER}
      - SPRING_DATASOURCE_PASSWORD=${IGRP_DATABASE_PASSWORD}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${IGRP_LOCAL_DATABASE_HOSTNAME}:5432/${IGRP_PROCESS_DATABASE_MANAGEMENT}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${PROCESS_JPA_HIBERNATE_DDL_AUTO}
      - IGRP_KEYCLOAK_REALM=${IGRP_IAM_TENANT}
      - AUTH_JWT_ISSUER=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/auth/realms/igrp
      - ENABLE_SWAGGER=${PROCESS_ENABLE_SWAGGER}
      - SPRINGDOC_SWAGGER_UI_DISABLE_SWAGGER_DEFAULT_URL=true
      - SPRINGDOC_SWAGGER_UI_URL=/gateway-api/demoteste-process-management-api/v3/api-docs
      - SPRINGDOC_SWAGGER_UI_CONFIG_URL=/gateway-api/demoteste-process-management-api/v3/api-docs/swagger-config
      - OPENAPI_SERVER_API=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-process-management-api
      - SPRING_APPLICATION_NAME=demoteste-process-management-api
      - LOGGING_LEVEL_ROOT=${PROCESS_LOGGING_LEVEL_ROOT}
      - LOGGING_LEVEL_SPRING_WEB=${PROCESS_LOGGING_LEVEL_SPRING_WEB}
      - LOGGING_LEVEL_APP=${PROCESS_LOGGING_LEVEL_APP}
      - EUREKA_CLIENT_ENABLED=true
      - SPRING_CLOUD_DISCOVERY_ENABLED=true
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_SERVICE_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVICE_URL}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - IGRP_MAIL_DEFAULT_FROM=${IGRP_MAIL_DEFAULT_FROM}
      - SPRING_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH}
      - SPRING_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS_ENABLE}
      - IGRP_ACCESS_API_BASE_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-access-management
#      - SPRING_KAFKA_BOOTSTRAP_SERVERS=demoteste-process-kafka:9092
      - OTEL_DISABLED=${PROCESS_MANAGEMENT_OTEL_DISABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${PROCESS_OTEL_EXPORTER_OTLP_ENDPOINT}
      - IGRP_ACCESS_M2M_SYNC_TOKEN=${PROCESS_M2M_SYNC_TOKEN}
      - IGRP_AUTHORIZATION_SERVICE_ADAPTER=${PROCESS_AUTHORIZATION_SERVICE_ADAPTER}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "web"
      name: "IgrpProcessManagement"
    command: ["/app/aprocess-management-api", "--spring.profiles.active=development"]

  demoteste-process-studio-api:
    image: registry.nosi.cv/igrp/igrp-process-studio-backend-api-jvm:latest
    container_name: demoteste-process-studio-api
    restart: unless-stopped
    depends_on:
      demoteste-process-studio-db-prepare:
        condition: service_completed_successfully
    env_file:
      - .env_process
    environment:
      - SERVICE_PORT=8080
      - SPRING_DATASOURCE_USERNAME=${IGRP_DATABASE_USER}
      - SPRING_DATASOURCE_PASSWORD=${IGRP_DATABASE_PASSWORD}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${IGRP_LOCAL_DATABASE_HOSTNAME}:5432/${IGRP_PROCESS_DATABASE_STUDIO}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${PROCESS_JPA_HIBERNATE_DDL_AUTO}
      - IGRP_KEYCLOAK_REALM=${IGRP_IAM_TENANT}
      - AUTH_JWT_ISSUER=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/auth/realms/igrp
      - ENABLE_SWAGGER=${PROCESS_ENABLE_SWAGGER}
      - SPRINGDOC_SWAGGER_UI_DISABLE_SWAGGER_DEFAULT_URL=true
      - SPRINGDOC_SWAGGER_UI_URL=/gateway-api/demoteste-process-studio-api/v3/api-docs
      - SPRINGDOC_SWAGGER_UI_CONFIG_URL=/gateway-api/demoteste-process-studio-api/v3/api-docs/swagger-config
      - OPENAPI_SERVER_API=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-process-studio-api
      - SPRING_APPLICATION_NAME=demoteste-process-studio-api
      - LOGGING_LEVEL_ROOT=${PROCESS_LOGGING_LEVEL_ROOT}
      - LOGGING_LEVEL_SPRING_WEB=${PROCESS_LOGGING_LEVEL_SPRING_WEB}
      - LOGGING_LEVEL_APP=${PROCESS_LOGGING_LEVEL_APP}
      - EUREKA_CLIENT_ENABLED=true
      - SPRING_CLOUD_DISCOVERY_ENABLED=true
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_SERVICE_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVICE_URL}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}  
      - IGRP_PROCESS_ENGINE_BASE_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-process-management-api
      - OTEL_DISABLED=${PROCESS_STUDIO_OTEL_DISABLED}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${PROCESS_OTEL_EXPORTER_OTLP_ENDPOINT}
      - IGRP_ACCESS_M2M_SYNC_TOKEN=${PROCESS_M2M_SYNC_TOKEN}
      
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "web"
      name: "IgrpProcessStudio"
    command: ["/app/process-studio-api", "--spring.profiles.active=development"]

  demoteste-igrp-process-management:
    image: registry.nosi.cv/igrp/igrp-process-management-frontend:latest
    container_name: demoteste-igrp-process-management
    depends_on:
      demoteste-process-management-api:
        condition: service_started
    environment:
      - AUTH_PROVIDER=${AUTH_PROVIDER}
      - KEYCLOAK_ISSUER=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/auth/realms/igrp
      - KEYCLOAK_CLIENT_ID=${IGRP_IAM_CLIENT_ID:-access-management}
      - KEYCLOAK_CLIENT_SECRET=${IGRP_IAM_CLIENT_SECRET:-**********}
      - NEXTAUTH_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/apps/demoteste-igrp-process-management/api/auth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - IGRP_ACCESS_MANAGEMENT_API=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-access-management
      - IGRP_APP_CODE=IGRP_PROCESS_MANAGEMENT
      - IGRP_PREVIEW_MODE=false
      - IGRP_APP_NAME_DESCRIPTION='IGRP Process Management'
      - IGRP_APP_CENTER_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}
      - API_GATEWAY=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-process-management-api
      - IGRP_APP_HOME_SLUG=/processinstances
      - IGRP_APP_BASE_PATH=/apps/demoteste-igrp-process-management
      - NEXT_PUBLIC_APP_BASE_RUNTIME_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}
      - NEXTAUTH_URL_INTERNAL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/apps/demoteste-igrp-process-management
      - NEXT_PUBLIC_IMAGE_STORAGE=https://${DOCKER_IP}:${NGINX_HTTP_PORT}/minio/igrp
      - IGRP_SYNC_ON_CODE_MENUS=${PROCESS_MANAGEMENT_SYNC_ON_CODE_MENUS}
      - IGRP_SYNC_ACCESS=${PROCESS_MANAGEMENT_SYNC_ACCESS}
      - IGRP_M2M_SERVICE_ID=${PROCESS_MANAGEMENT_M2M_SERVICE_ID}
      - IGRP_M2M_TOKEN=${PROCESS_MANAGEMENT_M2M_TOKEN}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "web"
      name: "igrpProcessManagementUi"
    command:
      - sh
      - -c
      - |
        (
          until wget -q -O /dev/null "http://${DOCKER_IP}:${NGINX_HTTP_PORT}/apps/demoteste-igrp-process-management"; do
            echo "Waiting for Process Management UI route..."
            sleep 5
          done
          echo "Process Management UI route called for App Center sync."
        ) &
        exec node server.js
  
  demoteste-igrp-process-studio:
    image: registry.nosi.cv/igrp/igrp-process-studio-frontend:latest
    container_name: demoteste-igrp-process-studio
    depends_on:
      demoteste-process-studio-api:
        condition: service_started
    environment:
      - AUTH_PROVIDER=${AUTH_PROVIDER}
      - KEYCLOAK_ISSUER=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/auth/realms/igrp
      - KEYCLOAK_CLIENT_ID=${IGRP_IAM_CLIENT_ID:-access-management}
      - KEYCLOAK_CLIENT_SECRET=${IGRP_IAM_CLIENT_SECRET:-**********}
      - NEXTAUTH_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/apps/demoteste-igrp-process-studio/api/auth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - IGRP_ACCESS_MANAGEMENT_API=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-access-management
      - IGRP_APP_CODE=IGRP_PROCESS_STUDIO
      - IGRP_PREVIEW_MODE=false
      - IGRP_APP_NAME_DESCRIPTION='IGRP Process Studio'
      - IGRP_APP_CENTER_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}
      - API_GATEWAY=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/gateway-api/demoteste-process-studio-api
      - IGRP_APP_HOME_SLUG=/process
      - IGRP_APP_BASE_PATH=/apps/demoteste-igrp-process-studio
      - NEXT_PUBLIC_APP_BASE_RUNTIME_URL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}
      - NEXTAUTH_URL_INTERNAL=http://${DOCKER_IP}:${NGINX_HTTP_PORT}/apps/demoteste-igrp-process-studio
      - NEXT_PUBLIC_IMAGE_STORAGE=https://${DOCKER_IP}:${NGINX_HTTP_PORT}/minio/igrp
      - IGRP_SYNC_ON_CODE_MENUS=${PROCESS_STUDIO_SYNC_ON_CODE_MENUS}
      - IGRP_SYNC_ACCESS=${PROCESS_STUDIO_SYNC_ACCESS}
      - IGRP_M2M_SERVICE_ID=${PROCESS_STUDIO_M2M_SERVICE_ID}
      - IGRP_M2M_TOKEN=${PROCESS_STUDIO_M2M_TOKEN}
    extra_hosts:
      - "demoteste-igrp:host-gateway"
      - "demoteste:host-gateway"
    labels:
      type: "web"
      name: "igrpProcessManagementUi"
    command:
      - sh
      - -c
      - |
        (
          until wget -q -O /dev/null "http://${DOCKER_IP}:${NGINX_HTTP_PORT}/apps/demoteste-igrp-process-studio"; do
            echo "Waiting for Process Studio UI route..."
            sleep 5
          done
          echo "Process Studio UI route called for App Center sync."
        ) &
        exec node server.js
  


